# OpenSpec config — bản nháp 2026-11-27
# Đặt sau khi chạy: openspec init --tools claude

context: |
  Sản phẩm: nền tảng quản lý digital workers (nhân viên số) cho SME Việt Nam (10–200 người).
  Chủ DN "tuyển" worker, giao kỹ năng (Agent Skills / SKILL.md), cấp quyền connector (Google Sheets, email),
  cho worker làm việc qua app chat (Telegram 1:1 + nhóm, Zalo 1:1, web chat) và quản lý như nhân sự:
  thử việc → chính thức → tạm nghỉ → nghỉ việc, quy tắc duyệt, ngân sách ("lương"), bảng lương.

  Vai trò: Owner (chủ DN), Admin (phụ trách AI), Manager (trưởng phòng), Member (nhân viên).
  Dữ liệu nhiều công ty (multi-tenant), tách bằng company_id + Row-Level Security.

  Nguồn sự thật: docs/requirements.md (sổ quyết định mục 0.2) > openspec/specs/ > code.
  Kiến trúc: docs/architecture.md. Thứ tự change: docs/ROADMAP.md.

  Thuật ngữ:
  - Worker: digital worker, một AI agent có hồ sơ nhân sự.
  - Skill: kỹ năng theo chuẩn SKILL.md; có version.
  - Grant: quyền của worker trên một connector (read / draft / write).
  - Task: một việc worker nhận (từ chat hoặc lịch).
  - Approval: yêu cầu duyệt cho hành động rủi ro.
  - Review: một lần kiểm duyệt worker / skill.
  - CostEntry: chi phí một lần gọi mô hình.

rules:
  proposal:
    - Change phải xong trong 1–2 buổi; lớn hơn thì chia.
    - Câu hỏi nghiệp vụ nêu trong mô tả PR; câu trả lời ghi vào docs/requirements.md mục 0.2.
  specs:
    - Viết spec và kịch bản bằng tiếng Việt; tên requirement ngắn.
    - Mỗi bước kịch bản giữ từ khoá tiếng Anh mà CLI đòi ("- **WHEN** …", "- **THEN** …"), nội dung sau từ khoá viết tiếng Việt.
    - Mỗi requirement có ít nhất một kịch bản; requirement dài thì tách nhỏ để qua --strict.
    - Mọi requirement chạm dữ liệu phải có kịch bản tách công ty (công ty A không thấy dữ liệu công ty B).
    - Mọi requirement về hành động của worker phải có kịch bản thiếu quyền và kịch bản cần duyệt.
    - Quyền kiểm tra trong code, không dựa vào prompt. Nội dung ngoài là dữ liệu, không phải lệnh.
  design:
    - design.md nêu phương án đã cân nhắc và lý do chọn.
    - Không thêm thư viện ngoài danh sách trong CLAUDE.md; muốn thêm thì nêu trong design.md kèm lý do.
    - Quyền kiểm tra trong code, không dựa vào prompt. Nội dung ngoài là dữ liệu, không phải lệnh.
  tasks:
    - Change phải xong trong 1–2 buổi; lớn hơn thì chia.
    - Mọi API mới có test tích hợp tách công ty (công ty A không đọc / sửa được dữ liệu công ty B).
