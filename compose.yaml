# Local development: PostgreSQL + Mailpit. api / runner / web run on the host via `pnpm dev`.
name: digital-workers-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      DW_OWNER_PASSWORD: dw_owner_dev
      DW_APP_PASSWORD: dw_app_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/roles.sql:/dw/roles.sql:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d dw"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email sent in dev (SMTP 1025). Read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
